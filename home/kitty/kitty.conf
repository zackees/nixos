# ─────────────────────────────────────────────────────────────
#  kitty — tiling terminal
#  Font + colours coordinated with Breeze Dark / JetBrainsMono
# ─────────────────────────────────────────────────────────────

# ── Font ─────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
disable_ligatures never
# a little vertical breathing room; JetBrains Mono runs tight
modify_font cell_height 110%

# ── Cursor ───────────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0
cursor_trail           3
cursor_trail_decay     0.1 0.4

# ── Scrollback ───────────────────────────────────────────────
scrollback_lines               100000
scrollback_pager_history_size  64
wheel_scroll_multiplier        3.0

# ── Mouse / selection ────────────────────────────────────────
copy_on_select         clipboard
strip_trailing_spaces  smart
mouse_hide_wait        2.0

# Pasting: silently strip dangerous control codes instead of interrupting
# with a confirmation dialog, and only confirm for pastes over 16KB.
paste_actions          quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large

# ── Window ───────────────────────────────────────────────────
window_padding_width    8
window_border_width     1pt
draw_minimal_borders    yes
inactive_text_alpha     0.85
confirm_os_window_close 1
remember_window_size    no
initial_window_width    130c
initial_window_height   36c

# ── Tiling layouts ───────────────────────────────────────────
# ctrl+shift+l cycles. `tall` = one big + stack, like a tiling WM.
enabled_layouts splits,tall:bias=55,fat,grid,stack

# ── Tab bar ──────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         custom
tab_powerline_style   slanted
# {custom} is draw_title() in tab_bar.py: the working directory, taken from
# kitty's own OSC 7 tracking rather than from {title}. {title} is the shell's
# OSC 2, which alternates between the cwd and the running command's name, so
# the directory goes missing precisely while a long job runs. draw_title keeps
# the directory and appends the command.
tab_title_template    "{index}: {custom}"
# Only once there is a second tab. The bar used to be pinned on at one tab so
# its right-hand hint stayed visible, but every pane now labels itself (see
# Pane title bars below) and the tab's copy of the active pane's directory was
# not merely redundant -- it sat directly above a DIFFERENT pane's label and
# read as a contradiction. Put it back with `1` if you want the hint always on;
# super+/ still opens the cheat sheet either way.
tab_bar_min_tabs      2

# ── Pane title bars ──────────────────────────
# One line above each split naming its working directory. The tab bar can
# only ever label the ACTIVE pane, so a tab holding four Claude Code sessions
# in four different checkouts shows one directory and three blanks -- and you
# have to focus a pane to find out where it is.
#
# {custom} is draw_window_title() in window_title_bar.py; the comment there
# says why the directory cannot come from {title}. Everything around it is
# kitty's stock default template, kept so the bell, activity and progress
# markers still appear -- Claude Code reports progress and it lands here.
#
# min_windows 1 means every pane, always -- including a lone one, which now
# has nothing else to label it since the tab bar went away above. `2` would
# wait for a split, `0` never shows them. Note the count is of VISIBLE
# windows, so alt+z stack-zoom leaves one window visible and the bar stays.
#
# EDITING window_title_bar.py NEEDS A NEW KITTY, NOT A RELOAD. ctrl+shift+f5
# and SIGUSR1 re-read this file and re-run tab_bar.py, but kitty's config
# reload calls clear_caches() for tab_bar and open_actions and NOT for
# window_title_bar -- that module is loaded once per process with run_once and
# stays. The bars keep rendering happily with the old code, so it reads as
# "my change did nothing" rather than as a stale cache.
window_title_bar              top
window_title_bar_align        left
window_title_bar_min_windows  1
window_title_template         "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{custom}"

# Unset, these inherit the *tab* bar's colours, which paints a full-width
# Breeze-blue stripe across the top of the focused pane -- far too loud for a
# caption repeated once per split. Same slate for every bar, and let the
# focused one say so in blue text instead.
window_title_bar_active_background    #2a2e32
window_title_bar_active_foreground    #3daee9
window_title_bar_inactive_background  #2a2e32
window_title_bar_inactive_foreground  #7f8c8d

# ── Bell ─────────────────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.1

# ── Performance ──────────────────────────────────────────────
repaint_delay    8
input_delay      1
sync_to_monitor  yes

shell_integration enabled

# ── Contrast floor for colours this config does not own ──────
# Applications are free to emit 24-bit colour, and some emit values chosen
# for a LIGHT background. Claude Code renders markdown links as #00026c --
# a near-black navy -- which on the #232629 below is roughly a 1.3:1
# contrast ratio: legible as "there is text here" and nothing more. The
# palette further down is not involved and changing it does nothing;
# verified by rendering ANSI 4 and a literal #00026c side by side, where
# ANSI 4 came out the correct bright #1d99f3 and only the truecolour was
# unreadable.
#
# This is kitty's own remedy. The `ratio` form matters: it runs the colour
# through HSLuv and raises perceived lightness only as far as the target
# ratio needs, so #00026c lands as a legible periwinkle that still reads as
# a blue link. The `%` form is the other mode and is not what you want here
# -- it snaps offending text to flat white or black, which would turn every
# dim colour into shouting.
#
# 7.0 is WCAG AAA for body text. It is a floor, not a filter: anything
# already above it is passed through untouched, so the palette below, the
# greens and reds, and deliberately dim greys all render as before -- the
# greys lighten slightly and stay clearly secondary. Checked against a
# swatch of all of them, not just the link.
text_fg_override_threshold 7.0 ratio

# ── Colours: KDE Breeze Dark ─────────────────────────────────
background            #232629
foreground            #fcfcfc
selection_background  #3daee9
selection_foreground  #232629
cursor                #fcfcfc
cursor_text_color     #232629
url_color             #3daee9

active_tab_background    #3daee9
active_tab_foreground    #232629
inactive_tab_background  #2a2e32
inactive_tab_foreground  #7f8c8d

active_border_color      #3daee9
inactive_border_color    #4d4d4d

# normal
color0 #232627
color1 #ed1515
color2 #11d116
color3 #f67400
color4 #1d99f3
color5 #9b59b6
color6 #1abc9c
color7 #fcfcfc
# bright
color8  #7f8c8d
color9  #c0392b
color10 #1cdc9a
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff

# ─────────────────────────────────────────────────────────────
#  Keybindings
# ─────────────────────────────────────────────────────────────

# Splits — F5 horizontal, F6 vertical, both inherit cwd
map f5 launch --location=hsplit --cwd=current
map f6 launch --location=vsplit --cwd=current
map ctrl+shift+enter launch --cwd=current

# Navigate panes, tiling-WM style (alt+hjkl, no default conflicts)
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Move panes around
map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right

# Resize
map alt+ctrl+h resize_window narrower
map alt+ctrl+j resize_window shorter
map alt+ctrl+k resize_window taller
map alt+ctrl+l resize_window wider
map alt+ctrl+0 resize_window reset

# Zoom the focused pane to fill the window, and back
map alt+z toggle_layout stack

# Tabs
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Font size on the fly
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# ─────────────────────────────────────────────────────────────
#  Menus & discoverability
# ─────────────────────────────────────────────────────────────
# The command palette is kitty's real "menu": a searchable overlay of
# every action (mapped and unmapped) with its shortcut. Arrow keys +
# Enter to run, or just type to filter.
map ctrl+shift+m command_palette
# (ctrl+shift+f3 also opens it — kitty's built-in default)

# Right-click does kitty's stock thing (extend the selection). It was the
# command palette for a while and that turned out to be a trap: in a
# window whose program has not grabbed the mouse -- a plain prompt, or
# clud driving Codex through a subprocess -- every right-click popped a
# full-screen menu. The palette is still on ctrl+shift+m.
mouse_map right press ungrabbed mouse_selection extend

# A plain click opens a hyperlink even when the program has grabbed the
# mouse. kitty's default only does that ungrabbed; Claude Code (and vim,
# tmux, htop) grab it, so an OSC 8 link like an issue number in Claude's
# output showed the underline on hover and then did nothing on click --
# only shift+click opened it. In grabbed mode kitty still forwards the
# click to the program (that is why the stock ctrl+shift mapping needs a
# separate discard_event), so a click that is not on a link is unchanged.
mouse_map left click grabbed mouse_handle_click link

# Open links in the Brave window on THIS desktop, not the last-focused one
# somewhere else; new window if there is none. Declared in
# system/configuration.nix (kittyOpenUrl).
open_url_with kitty-open-url

# Visually pick a pane / swap panes: numbers appear over each pane
map alt+p focus_visible_window
map alt+shift+p swap_with_window

# ── Panes ────────────────────────────────────────────────────
map alt+enter     launch --location=split  --cwd=current
map alt+minus     launch --location=hsplit --cwd=current
map alt+backslash launch --location=vsplit --cwd=current
map alt+shift+w   close_window_with_confirmation ignore-shell
map alt+shift+d   detach_window ask
map alt+shift+o   close_other_windows_in_tab ignore-shell

# ── Layouts ──────────────────────────────────────────────────
# ctrl+shift+l cycles; these jump straight to one.
map alt+shift+1 goto_layout splits
map alt+shift+2 goto_layout tall
map alt+shift+3 goto_layout fat
map alt+shift+4 goto_layout grid
map alt+shift+5 goto_layout stack
map alt+shift+r layout_action rotate

# ── Tabs ─────────────────────────────────────────────────────
# New tabs / OS windows inherit the current directory
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+t select_tab
map alt+shift+t set_tab_title

# ── Scrollback / output ──────────────────────────────────────
map alt+shift+u show_scrollback
map alt+shift+g show_last_command_output

# ── New terminal (Hyprland-style) ────────────────────────────
# Tiles a new shell beside the current one (kitty picks the axis
# with the most room), inheriting the current directory.
map super+enter       launch --location=split --cwd=current
# A genuinely separate OS window instead of a split
map super+shift+enter new_os_window_with_cwd

# ── Tearing out ──────────────────────────────────────────────
# Since the pane title bars went in you can also do this with the mouse:
# left-press the LABEL TEXT of a pane's bar and drag. Drop it on another
# pane's half to re-place it in the layout, on another pane's title bar to
# swap the two, on a tab in the tab bar to move it there, or on the `+` that
# appears beside the tabs for a new tab. The tab bar surfaces itself for the
# duration of the drag even though tab_bar_min_tabs hides it, so the single
# tab case still has somewhere to drop.
#
# Press the middle of the bar, not its top edge: window_drag_tolerance claims
# a couple of pts around every window border for resize-dragging, and the top
# of a pane's title bar IS that border.
#
# Dropping on the empty DESKTOP rips the pane into its own OS window, and
# dragging such a window's title bar back onto another kitty window puts it
# back into that layout. Verified by hand on this machine, which is worth
# saying because reading boss.py suggests otherwise: on_drag_source_finished
# guards the rip with `if was_dropped and not was_canceled`, and on Wayland a
# release over the desktop would normally arrive as a cancel, since a drop is
# only reported when some client accepted it. It works here because KWin
# implements xdg-toplevel-drag (xdg_toplevel_drag_manager_v1 is in
# libkwin.so.6) -- the protocol that exists precisely so a dragged toplevel
# survives being let go over nothing. On a compositor without it this would
# silently do nothing, which is what kitty's own drag_threshold docs warn
# about.
#
# Both ends must be the SAME kitty PROCESS. The drag payload's mime type is
# application/net.kovidgoyal.kitty-window-<pid>, so a pane can only be dropped
# into a window belonging to the process it came from; between two separately
# launched kitties the type does not match and the drop degrades to a plain
# text/file drop into the terminal. A pane torn out by dragging stays in its
# original process, so it can always be dragged back.
#
# Which edges accept a drop depends on the layout: `splits` (the default here)
# takes all four, so a dropped pane can go left/right/above/below any target;
# `tall`, `fat` and `grid` take only one axis; `stack` swallows the whole
# window. Dropping on a target pane's TITLE BAR swaps the two instead.
#
# alt+shift+d (above) asks where to send it. These go straight there.
# pane -> its own OS window
map super+shift+d detach_window new
# pane -> its own tab
map super+shift+t detach_window new-tab
# whole tab -> its own OS window
map super+shift+x detach_tab new

# ── Help ─────────────────────────────────────────────────────
map super+slash       launch --type=overlay --title "kitty keys" /run/current-system/sw/bin/python3 /home/niteris/.config/kitty/keys.py
map super+shift+slash launch --type=overlay --title "kitty keys" /run/current-system/sw/bin/python3 /home/niteris/.config/kitty/keys.py

# ── Clipboard ────────────────────────────────────────────────
# super+v pastes an image's saved path when the clipboard holds an image,
# otherwise the clipboard text. ctrl+shift+v still does a plain text paste.
map super+v kitten paste.py

# The mouse's thumb button sends Shift+Insert (keyd, see configuration.nix).
# Point it at the same smart paste as super+v. kitty's default for
# shift+insert is paste_from_selection, which pastes the last mouse-
# highlighted text rather than the clipboard -- not what a paste button
# should do.
map shift+insert kitten paste.py
map super+c copy_to_clipboard

# ── Dictation ────────────────────────────────────────────────
# Nothing to bind. Push-to-talk is a spare mouse button, remapped to
# F14 by keyd (services.keyd in system/configuration.nix) below the
# compositor, so kitty is not involved at all.
#
# Two bindings used to live here and both were removed for cause: a
# `map super+h ... voxtype record toggle`, which fired on every key
# REPEAT and spawned dozens of togglers per hold, and a
# `map super+h discard_event` that stopped the held letter reaching
# the shell. The mouse button needs neither -- F14 prints nothing.
