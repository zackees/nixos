# voxtype - see /nix/store/.../share/voxtype/default-config.toml for all keys.
state_file = "auto"

[hotkey]
# Hold-to-talk, via voxtype's own evdev reader rather than a KDE global
# shortcut. KGlobalAccel delivers press only - it has no key-release event -
# so a KDE binding can never do more than toggle. evdev sees both edges.
#
# Needs the `input` group (set in system/configuration.nix); without it the
# hotkey silently does nothing. The matching KDE shortcut on Meta+H was
# removed: left in place it fired `record toggle` on the same press and
# fought the hold.
enabled = true
# EVTEST_35, not "H": voxtype's key-name table covers only dedicated keys -
# SCROLLLOCK, PAUSE, CAPSLOCK, INSERT, the modifiers, F1-F24, END, SPACE and
# the media keys. Letters are not in it, and "H" and "KEY_H" are both
# rejected outright. 35 is KEY_H's kernel keycode from
# <linux/input-event-codes.h>, and EVTEST_ is the prefix for that numbering
# (WEV_/X11_/XEV_ are the XKB one, offset by 8). Verified by the daemon
# logging: Listening for KEY_H (with modifiers: {KEY_LEFTMETA}).
key = "EVTEST_35"
modifiers = ["LEFTMETA"]
mode = "push_to_talk"

[osd]
# Enabled via an overlay that builds the osd-gtk4 cargo feature, which
# stock nixpkgs omits.
enabled = true

[vad]
# Voice activity detection, so silence is never handed to whisper. Needs
# ggml-silero-vad.bin in ~/.local/share/voxtype/models (scripts/04-apply-home.sh
# fetches it). backend = "whisper" uses that model; "energy" is the
# model-free fallback and is markedly less accurate with background noise.
enabled = true
backend = "whisper"

[audio]
# You have three capture devices (Cam Link 4K, Scarlett 2i2, Elgato Wave:3).
# "default" follows the PipeWire default source; set explicitly with a name
# from `pactl list sources short` if it picks the wrong one.
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "base.en"
language = "en"
on_demand_loading = false
# Transcription used to cost a flat ~10.2s whether the clip was 0.9s or 1.5s,
# because whisper.cpp pads every recording out to its full 30s context window.
# This shrinks the window for clips under 22.5s, which is every dictation.
# Off by default upstream only because large-v3/turbo can fall into repetition
# loops with it; base.en does not.
context_window_optimization = true

[output]
# ydotool, not wtype: KWin does not implement the virtual keyboard protocol.
mode = "type"
# Pin the driver: the default order tries wtype first, and voxtype's own
# check only verifies wtype is installed, not that the compositor supports
# it. On KWin wtype always fails, so name ydotool explicitly.
driver_order = ["ydotool", "clipboard"]
fallback_to_clipboard = true

[audio.feedback]
# Beep when recording starts and stops - an audible cue alongside the OSD,
# for when the overlay is off-screen or the eyes are elsewhere.
enabled = true
theme = "default"
volume = 0.7

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = true
