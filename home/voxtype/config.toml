# voxtype - see /nix/store/.../share/voxtype/default-config.toml for all keys.
state_file = "auto"

[hotkey]
# Hold-to-talk, via voxtype's own evdev reader rather than a KDE global
# shortcut. KGlobalAccel delivers press only - it has no key-release event -
# so a KDE binding can never do more than toggle. evdev sees both edges.
#
# Needs the `input` group (set in system/configuration.nix); without it the
# hotkey silently does nothing. The matching KDE shortcut on Meta+H was
# removed: left in place it fired `record toggle` on the same press and
# fought the hold.
enabled = true
# F14, though what you actually press is a spare button on the Compx
# mouse. That button's firmware emits KEY_LEFTSHIFT on the mouse's
# keyboard interface; keyd rewrites it to F14 for that device alone
# (services.keyd in system/configuration.nix), so this is what voxtype
# sees. Shift on the real keyboards is untouched.
#
# The indirection is not optional. voxtype's listener only READS keys, it
# never consumes them, so whatever the hotkey is also reaches the focused
# window -- as shift here, and as ~200 h's back when this was Super+H.
# voxtype's own key table admits only non-printing keys for that reason.
# F14 is one, so nothing acts on it.
#
# No modifiers: the button is a single key, and keyd emits a bare f14.
# Verified against the daemon's own line rather than assumed.
key = "F14"
modifiers = []
mode = "push_to_talk"

[osd]
# Enabled via an overlay that builds the osd-gtk4 cargo feature, which
# stock nixpkgs omits.
enabled = true

[vad]
# Voice activity detection, so silence is never handed to whisper. Needs
# ggml-silero-vad.bin in ~/.local/share/voxtype/models (scripts/03-apply-home.sh
# fetches it). backend = "whisper" uses that model; "energy" is the
# model-free fallback and is markedly less accurate with background noise.
enabled = true
backend = "whisper"

[audio]
# You have three capture devices (Cam Link 4K, Scarlett 2i2, Elgato Wave:3).
# "default" follows the PipeWire default source; set explicitly with a name
# from `pactl list sources short` if it picks the wrong one.
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "large-v3-turbo"
language = "en"
# Model switched from base.en to large-v3-turbo on 2026-09-16. That made
# on_demand_loading = true (below, was the setting here) cost far more than
# the reasoning that originally justified it: the file is ~11x bigger
# (~1.6 GB vs 142 MB), and the per-recording reload -- confirmed via the
# journal, not guesswork -- was taking 0.7-1.3s of CPU-side parsing and
# PCIe upload to VRAM, every single dictation, visibly on anything shorter
# than ~1-2s. Keeping the file in the OS page cache doesn't help: verified
# with `vmtouch` that it was already 100% resident in RAM (125 GB total, 96
# GB available -- no memory pressure to evict it), so the cost was never
# disk I/O to begin with.
#
# false keeps the model resident in VRAM instead, at daemon start and
# across recordings, so no per-dictation reload. What makes that not just
# "hold 1.6 GB forever" is cold_model_timeout_secs below: voxtype's own
# ModelManager already evicts idle models on a 60s timer, but upstream
# exempts the primary model from that eviction (its use case is freeing a
# *secondary* model reached via a hotkey modifier). system/patches/
# voxtype-primary-idle-evict.patch drops that exemption so the primary
# ages out too -- see the overlay in system/configuration.nix.
on_demand_loading = false
# How long the model can sit unused before ModelManager evicts it (see the
# patch note above -- without that patch this key has zero effect on the
# primary model, which is the only model here). Next recording after an
# eviction pays the same reload cost on_demand_loading used to pay on
# every dictation; kept short and deliberately so.
cold_model_timeout_secs = 60
# Transcription used to cost a flat ~10.2s whether the clip was 0.9s or 1.5s,
# because whisper.cpp pads every recording out to its full 30s context window.
# This shrinks the window for clips under 22.5s, which is every dictation.
# Off by default upstream only because large-v3/turbo can fall into repetition
# loops with it -- and the model is now large-v3-turbo, so it stays off.
context_window_optimization = false

[output]
# ydotool, not wtype: KWin does not implement the virtual keyboard protocol.
mode = "type"
# Pin the driver: the default order tries wtype first, and voxtype's own
# check only verifies wtype is installed, not that the compositor supports
# it. On KWin wtype always fails, so name ydotool explicitly.
driver_order = ["ydotool", "clipboard"]
fallback_to_clipboard = true

[audio.feedback]
# Beep when recording starts and stops - an audible cue alongside the OSD,
# for when the overlay is off-screen or the eyes are elsewhere.
enabled = true
theme = "default"
volume = 0.7

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = true
