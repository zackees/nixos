# nixos#29: a backstop for a push that bypasses scripts/sync.sh -- an
# amend, a force-push, a plain `git push` -- since sync.sh's own gitleaks
# gate only runs when someone actually invokes sync.sh. This is the
# tested (job 2 proves the tool itself still catches something) and
# history-aware (job 1 scans every commit, not just the tip) half of the
# pair; sync.sh is the fast, no-CI-round-trip local half.
name: secrets scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
      # Scans full commit history (see .gitleaks.toml for config), not just
      # the tip -- a rebase or a cherry-pick can resurrect an old blob that
      # a working-tree-only scan would never see again.
      - run: nix run nixpkgs#gitleaks -- detect --source . -v

  gate-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # Proves the gate above actually catches something, rather than
      # trusting a clean scan to mean the gate works and not just that it
      # silently no-ops (see scripts/test-secrets-scan.sh for the two traps
      # that made an earlier version of this test pass unconditionally).
      - run: scripts/test-secrets-scan.sh
